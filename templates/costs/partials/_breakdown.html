{% load humanize %}
<div class="col-12 col-md-6 col-xl-3">
  <div class="ct-card h-100">
    <div class="ct-card-header">
      <span><i class="bi {{ icon }} me-1"></i> {{ title }}</span>
      {% if dim %}<a class="small text-decoration-none" href="{% url 'costs:explorer' %}?dim={{ dim }}&amp;days={{ days }}">Explore</a>{% endif %}
    </div>
    <div class="table-responsive">
      <table class="table ct-table align-middle mb-0">
        <thead>
          <tr><th>Name</th><th class="text-end">Runs</th><th class="text-end">Cost</th></tr>
        </thead>
        <tbody>
          {% for row in rows %}
            <tr>
              <td class="small text-truncate" style="max-width:150px" title="{{ row.label }}">{{ row.label }}</td>
              <td class="small text-end">{{ row.runs|intcomma }}</td>
              <td class="small text-end text-nowrap">${{ row.cost|floatformat:4 }}</td>
            </tr>
          {% empty %}
            <tr><td colspan="3" class="text-center text-muted small py-4">No spend recorded.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
