{% extends "base.html" %}

{% block title %}{{ section.title }} - Documentation{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 small">
  <span class="text-muted"><i class="bi bi-journal-text me-1"></i>{{ section.doc_title }}</span>
  <span class="d-flex gap-3">
    {% if previous %}<a class="text-decoration-none" href="{{ previous.url }}"><i class="bi bi-arrow-left"></i> {{ previous.title|truncatechars:48 }}</a>{% endif %}
    {% if next %}<a class="text-decoration-none" href="{{ next.url }}">{{ next.title|truncatechars:48 }} <i class="bi bi-arrow-right"></i></a>{% endif %}
  </span>
</div>

<div class="ct-card">
  <div class="ct-card-body ct-doc-section">
    {{ body_html|safe }}
  </div>
</div>
{% endblock %}
