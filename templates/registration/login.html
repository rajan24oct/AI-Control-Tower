{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - AI Control Tower</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/control-tower.css' %}">
</head>
<body>
<div class="ct-login">
  <div class="ct-login-card">
    <div class="text-center mb-4 text-white">
      <i class="bi bi-broadcast-pin" style="font-size:2.5rem;color:#60a5fa"></i>
      <h1 class="h4 mt-2 mb-1">AI Control Tower</h1>
      <p class="small text-secondary mb-0">Enterprise AI Mission Control</p>
    </div>

    <div class="card border-0 shadow">
      <div class="card-body p-4">
        {% if form.errors %}
          <div class="alert alert-danger py-2 small">
            The email address or password is incorrect.
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label small fw-semibold">Email</label>
            <input type="email" name="username" id="id_username" class="form-control" required autofocus
                   autocomplete="username">
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required
                   autocomplete="current-password">
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
