services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aig_tower}
      POSTGRES_USER: ${POSTGRES_USER:-aig_tower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aig_tower}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aig_tower}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 aig_tower.asgi:application"
    env_file: .env
    environment:
      USE_SQLITE: "0"
      USE_MANIFEST_STATIC: "1"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      # Dedicated Redis database so monitor broadcasts never collide with the
      # cache or the Celery queues.
      CHANNEL_LAYER_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A aig_tower worker --loglevel=info
    env_file: .env
    environment:
      USE_SQLITE: "0"
      POSTGRES_HOST: postgres
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    command: celery -A aig_tower beat --loglevel=info
    env_file: .env
    environment:
      USE_SQLITE: "0"
      POSTGRES_HOST: postgres
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
